name: Build APK
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - name: Setup Android SDK
        run: |
          SDK_MANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -n 1)
          if [ -z "$SDK_MANAGER" ]; then
            mkdir -p $ANDROID_HOME/cmdline-tools/latest
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
            rm -rf /tmp/cmdline-tools /tmp/cmdline-tools.zip
            SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | $SDK_MANAGER --licenses > /dev/null 2>&1 || true
          $SDK_MANAGER "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
